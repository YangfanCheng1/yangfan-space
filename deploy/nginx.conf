# Yangfan's Space on Cloud Run (spec: docs/specs/portfolio-blog.md §8, P6).
# Static files only: pre-rendered pages, the client-only app shell, hashed assets.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml text/plain;

  error_page 404 /404.html;

  # Vite's hashed bundles never change: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location = /rss.xml {
    types { }
    default_type application/rss+xml;
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Client-only apps (e.g. /personal-finance) get the empty app shell.
  # Generated at build time from src/apps/registry.ts.
  include /etc/nginx/app-routes.conf;

  # Pre-rendered pages: /projects → /projects/index.html. Unknown paths → real 404.
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/index.html =404;
  }

  location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
